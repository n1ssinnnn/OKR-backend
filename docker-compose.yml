services:
  db:
    image: postgres:16-alpine
    container_name: okr-backend-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: okr
      POSTGRES_PASSWORD: okr_local
      POSTGRES_DB: okr
    ports:
      - "5432:5432"
    volumes:
      - okr_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U okr -d okr"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  okr_postgres_data:
